name: Next release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: next-release
  cancel-in-progress: true

jobs:
  release:
    # The app links against the macOS 27 SDK, so it needs the Xcode 27 image.
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Stamp build number
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Support/Explorer-Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.0-next.${{ github.run_number }}" Support/Explorer-Info.plist

      - name: Build
        run: make release

      - name: Package
        run: |
          codesign --verify --deep --strict build/Explorer.app
          make dmg
          cp build/Explorer.dmg Explorer.dmg
          shasum -a 256 Explorer.dmg | tee Explorer.dmg.sha256

      - name: Publish
        run: |
          short=$(git rev-parse --short HEAD)
          cat > notes.md <<EOF
          Latest build of \`main\` at ${short}. Apple Silicon, macOS 13 or later.

          Open Explorer.dmg and drag Explorer into Applications. If macOS won't open it, run:

          \`\`\`
          xattr -dr com.apple.quarantine /Applications/Explorer.app
          \`\`\`
          EOF

          # Removes every release on the next tag, including drafts left by a failed upload.
          cleanup() {
            local ids id
            ids=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.tag_name == "next") | .id') || return 1
            for id in $ids; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id" || return 1
            done
            if gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/next" >/dev/null 2>&1; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/next" || return 1
            fi
          }

          for attempt in 1 2 3 4 5; do
            if cleanup && gh release create next Explorer.dmg Explorer.dmg.sha256 \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Next (build ${{ github.run_number }}, ${short})" \
              --notes-file notes.md; then
              exit 0
            fi
            echo "::warning::Publish attempt $attempt failed"
            sleep $((attempt * 30))
          done
          exit 1
